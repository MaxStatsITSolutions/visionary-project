# Runs on every pull request and every push to main.
# A red cross means: do not merge until it is fixed.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# The workflow only needs to read the code.
permissions:
  contents: read

# If you push again while a check is still running, cancel the old one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      # Installs exactly what package-lock.json says.
      - run: npm ci

      - run: npm run lint

      # tsc -b (type check) + vite build. No real Supabase keys are needed:
      # the app runs in demo mode without them.
      - run: npm run build
